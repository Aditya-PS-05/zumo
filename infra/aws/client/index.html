<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#11130f">
    <meta name="color-scheme" content="dark">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <title>zumo cloud</title>
  </head>
  <body>
    <main>
      <header>
        <a class="brand" href="/"><span>z</span> zumo</a>
        <span id="connection" class="connection">Offline</span>
      </header>

      <section id="pair-view" class="pair-view">
        <p class="eyebrow">Secure pairing</p>
        <h1>Your agents,<br>one inbox.</h1>
        <p class="lede">On your workstation, open Zumo → Cloud pair. Enter the temporary code below. Source, diffs, transcripts, and terminal bytes never enter this relay.</p>
        <form id="pair-form">
          <label for="pair-code">Pairing code</label>
          <input id="pair-code" inputmode="text" autocomplete="one-time-code" maxlength="19" placeholder="ABCD-EFGH-JKLM-NPQR" required>
          <button type="submit">Pair this phone</button>
        </form>
        <p id="pair-error" class="error" hidden></p>
      </section>

      <section id="dashboard" hidden>
        <div class="overview">
          <div><p class="eyebrow">Paired machine</p><h1>Action inbox</h1></div>
          <p id="summary">Connecting…</p>
        </div>
        <nav><button class="tab active" data-tab="actions">Inbox <span id="action-count">0</span></button><button class="tab" data-tab="sessions">Live <span id="session-count">0</span></button></nav>
        <section id="actions"></section>
        <section id="sessions" hidden></section>
        <button id="forget" class="forget" type="button">Forget this machine</button>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
